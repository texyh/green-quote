name: Frontend

on:
  push:
    branches: [main]
    paths: [green-quote-frontend/**, .github/workflows/frontend.yml]
  pull_request:
    paths: [green-quote-frontend/**, .github/workflows/frontend.yml]

defaults:
  run:
    working-directory: green-quote-frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: green-quote-frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: green-quote-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
