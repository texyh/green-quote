services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: green_quote
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d green_quote"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./green-quote-backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/green_quote
      JWT_SECRET: 4de034df-5827-4076-b2d5-4e87b75ad660
      PORT: 3001
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./green-quote-frontend
      args:
        API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
