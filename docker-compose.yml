services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: green_quote
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d green_quote"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./green-quote-backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/green_quote
      JWT_SECRET: 4de034df-5827-4076-b2d5-4e87b75ad660
      PORT: 3001
      LOG_LEVEL: info
      SESSION_TTL_SECONDS: 3600
      PRICE_PER_KW_EUR: 1200
      ADMIN_EMAIL: admin@test.com
      ADMIN_PASSWORD: pass@test
      APP_URL: http://localhost:3000
      KEYCLOAK_URL: http://localhost:8080/realms/green-quote
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/green-quote
      KEYCLOAK_CLIENT_ID: green-quote-api
      KEYCLOAK_CLIENT_SECRET: green-quote-dev-secret
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    volumes:
      - ./keycloak/green-quote-realm.json:/opt/keycloak/data/import/green-quote-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./green-quote-frontend
      args:
        API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
